<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Remove the background from any photo, right in your browser. Nothing is uploaded."
    />
    <meta name="theme-color" content="#faf6f1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme and accent before first paint, so dark mode never flashes light: saved choice, else the system's.
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('cutout:theme')
        } catch (e) {} // storage blocked: fall through to the system's setting
        if (t !== 'light' && t !== 'dark') {
          try {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (e) {
            t = 'light'
          }
        }
        document.documentElement.dataset.theme = t
        var a = 'persimmon'
        try {
          var s = localStorage.getItem('cutout:accent')
          if (s === 'raspberry' || s === 'lavender' || s === 'sage') {
            a = s
            document.documentElement.dataset.accent = a
          }
        } catch (e) {} // storage blocked: the default accent stays
        // These mirror --paper in styles.css; the stylesheet isn't loaded yet at this point.
        var paper = {
          persimmon: ['#faf6f1', '#120b1b'],
          raspberry: ['#fbf5f6', '#160a11'],
          lavender: ['#f7f6fb', '#0f0d1a'],
          sage: ['#f5f7f3', '#0b120e'],
        }
        document.querySelector('meta[name="theme-color"]').content = paper[a][t === 'dark' ? 1 : 0]
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cameo" />
    <link rel="canonical" href="https://cameoapp.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cameo: remove backgrounds in your browser" />
    <meta
      property="og:description"
      content="Free, open-source background remover. Runs on your device, so nothing is uploaded."
    />
    <meta property="og:url" content="https://cameoapp.vercel.app/" />
    <meta property="og:image" content="https://cameoapp.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cameo: remove backgrounds in your browser" />
    <meta
      name="twitter:description"
      content="Free, open-source background remover. Runs on your device, so nothing is uploaded."
    />
    <meta name="twitter:image" content="https://cameoapp.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap"
    />
    <title>Cameo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
