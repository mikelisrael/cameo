name: Feature request
description: Suggest something Cameo could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This would not need a photo to leave the device
          required: true
